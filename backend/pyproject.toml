[project]
name = "compliance-engine-backend"
version = "0.1.0"
description = "Regulatory Compliance Intelligence & Audit Automation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "qdrant-client>=1.7.0",
    "boto3>=1.34.0",
    "minio>=7.2.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]
llm-groq = ["groq>=0.4.0"]
llm-gemini = ["google-generativeai>=0.3.0"]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing"
testpaths = ["tests"]

# ⬇️ ADD THIS SECTION ⬇️
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]  # Only include app package, exclude alembic
exclude = ["alembic*", "tests*"]